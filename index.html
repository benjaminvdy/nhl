<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<title>NHL Playoffs 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏒</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#0a0e1a;--c:#111827;--c2:#1a2035;--bl:#3b82f6;--cy:#06b6d4;--gn:#10b981;--or:#f59e0b;--rd:#ef4444;--pu:#8b5cf6;--t1:#f1f5f9;--t2:#94a3b8;--t3:#64748b;--bd:#1e293b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--t1);line-height:1.55}
::selection{background:rgba(59,130,246,.3)}
.hd{background:linear-gradient(135deg,#0f172a,#1e1b4b,#172554);border-bottom:1px solid rgba(59,130,246,.15);padding:.6rem 1rem;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.hd-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4rem}
.logo{display:flex;align-items:center;gap:.35rem}
.logo span{font-size:1.2rem}
.logo-t{font-size:.95rem;font-weight:800;background:linear-gradient(135deg,#60a5fa,#06b6d4,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-s{font-size:.4rem;text-transform:uppercase;letter-spacing:1.8px;color:var(--t3)}
.clks{display:flex;gap:.4rem}
.ck{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:.2rem .5rem;text-align:center;min-width:102px}
.ck .l{font-size:.42rem;text-transform:uppercase;letter-spacing:1px;color:var(--t3)}
.ck .t{font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
.ck-e .t{color:var(--bl)}.ck-p .t{color:var(--cy)}
.mx{max-width:1100px;margin:0 auto;padding:.7rem 1rem}
.ds{display:inline-flex;align-items:center;gap:.25rem;font-size:.52rem;padding:.2rem .45rem;border-radius:16px;margin-bottom:.5rem;border:1px solid var(--bd);background:rgba(17,24,39,.8)}
.ds .d{width:5px;height:5px;border-radius:50%;background:var(--gn);box-shadow:0 0 4px var(--gn)}
.ds .tx{color:var(--t3)}.ds .tx b{color:var(--t2)}
.info{display:flex;align-items:center;gap:.3rem;padding:.35rem .6rem;border-radius:9px;margin-bottom:.7rem;background:linear-gradient(135deg,rgba(245,158,11,.05),transparent);border:1px solid rgba(245,158,11,.1);font-size:.62rem;color:var(--or)}
.sh{display:flex;align-items:center;gap:.35rem;margin:1.1rem 0 .5rem}
.sh h2{font-size:.9rem;font-weight:800}
.sr{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.2rem;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.sr::-webkit-scrollbar{height:3px}.sr::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.sp{background:var(--c);border:1px solid var(--bd);border-radius:9px;padding:.4rem .5rem;min-width:150px;flex-shrink:0;transition:all .12s}
.sp:hover{border-color:rgba(59,130,246,.2);transform:translateY(-1px)}
.sp.mtl{border-color:rgba(175,30,45,.3)}.sp.dn{opacity:.4}
.sp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.2rem}
.sp-c{font-size:.36rem;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);font-weight:600}
.sp-s{font-size:.38rem;padding:1px 4px;border-radius:4px;font-weight:700}
.sp-s.t{background:rgba(245,158,11,.1);color:var(--or)}.sp-s.l{background:rgba(59,130,246,.1);color:var(--bl)}.sp-s.w{background:rgba(16,185,129,.1);color:var(--gn)}
.sp-m{display:flex;align-items:center;justify-content:space-between}
.sp-t{display:flex;flex-direction:column;align-items:center;flex:1}
.sp-t img{width:26px;height:26px;object-fit:contain}
.sp-a{font-size:.62rem;font-weight:800;margin-top:1px}
.sp-v{font-size:.42rem;color:var(--t3);font-weight:700}
.sp-w{display:flex;gap:2px;margin-top:2px}
.wd{width:5px;height:5px;border-radius:50%;background:var(--bd)}.wd.on{background:var(--gn)}
.dh{display:flex;align-items:center;gap:.3rem;margin:.9rem 0 .4rem;padding:.3rem .5rem;border-radius:7px;background:linear-gradient(90deg,rgba(59,130,246,.04),transparent);border-left:3px solid var(--bl)}
.dh-d{font-size:.75rem;font-weight:700}.dh-dt{font-size:.58rem;color:var(--t2)}
.dh .tdy{font-size:.34rem;background:var(--rd);color:#fff;padding:1px 4px;border-radius:8px;font-weight:700;text-transform:uppercase}
.gs{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.2rem}
.gc{background:var(--c);border:1px solid var(--bd);border-radius:10px;overflow:hidden;transition:all .1s}
.gc:hover{border-color:rgba(59,130,246,.15)}.gc.ifn{opacity:.35;border-style:dashed}
.g1{display:flex;align-items:stretch}
.gmu{display:flex;align-items:center;gap:.25rem;padding:.4rem .55rem;min-width:160px;background:rgba(255,255,255,.01)}
.gmu img{width:24px;height:24px;object-fit:contain}
.gmu .ab{font-size:.85rem;font-weight:800}.gmu .at{font-size:.5rem;color:var(--t3)}
.gmu .gi{font-size:.38rem;color:var(--t3);margin-left:auto;padding-left:.3rem;white-space:nowrap}
.gtz{flex:1;display:flex;border-left:1px solid var(--bd)}
.tz{flex:1;padding:.25rem .35rem;text-align:center;border-right:1px solid var(--bd)}
.tz:last-of-type{border-right:none}
.tz .lb{font-size:.34rem;text-transform:uppercase;letter-spacing:.6px;color:var(--t3)}
.tz .tm{font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.tz .dt{font-size:.36rem;color:var(--t3)}
.tz-e .tm{color:var(--bl)}.tz-p .tm{color:var(--cy)}
.g2{display:flex;border-top:1px solid var(--bd);background:rgba(0,0,0,.1)}
.gs2{flex:1;padding:.25rem .4rem;border-right:1px solid var(--bd)}.gs2:last-child{border-right:none}
.gs2 .sl{font-size:.34rem;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-bottom:1px;font-weight:600}
.tvt{display:flex;flex-wrap:wrap;gap:1px}
